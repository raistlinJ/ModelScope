[global]
# We intentionally pre-seed session_state for a handful of number_input
# widgets (e.g. SSH Port) *and* pass value= to work around a Streamlit quirk
# where a number_input revealed for the first time by another widget's
# on_change (e.g. toggling Execution Target to SSH) ignores the pre-seeded
# session_state value and falls back to min_value. Streamlit flags this
# combination with a one-time warning; this is that flag's intended escape
# hatch, not a general-purpose suppression.
disableWidgetStateDuplicationWarning = true

[server]
headless         = true
address          = "0.0.0.0"
port             = 8501
maxMessageSize   = 200

[theme]
# System font stack (no CDN, CSP safe). Paired palettes let Streamlit follow
# the browser preference before ModelScope records an explicit toggle choice.
font = "sans serif"
chartCategoricalColors = ["#0f766e", "#0969da", "#8250df", "#9a6700", "#1a7f37", "#cf222e"]

[theme.light]
primaryColor             = "#0f766e"
backgroundColor          = "#f6f8fa"
secondaryBackgroundColor = "#eef2f5"
textColor                = "#1f2328"
borderColor              = "#d0d7de"
codeBackgroundColor      = "#eef2f5"
codeTextColor            = "#1f2328"

[theme.light.sidebar]
backgroundColor          = "#ffffff"
secondaryBackgroundColor = "#eef2f5"

[theme.dark]
primaryColor             = "#2dd4bf"
backgroundColor          = "#0d1117"
secondaryBackgroundColor = "#21262d"
textColor                = "#e6edf3"
borderColor              = "#30363d"
codeBackgroundColor      = "#21262d"
codeTextColor            = "#e6edf3"

[theme.dark.sidebar]
backgroundColor          = "#161b22"
secondaryBackgroundColor = "#21262d"
